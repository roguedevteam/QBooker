services:
  - type: web
    name: qbooker-marketing
    runtime: static
    rootDir: marketing
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ADMIN_APP_URL
        sync: false
      - key: VITE_SUPPORT_EMAIL
        sync: false
      - key: VITE_MARKETING_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers. connect-src allows any *.up.railway.app API; if the API is served from a custom
    # domain, add it to connect-src below (Render header values cannot read env vars).
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://*.up.railway.app; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

